name: Controlled structural validation

on:
  workflow_dispatch:
  pull_request:
    types: [reopened]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve the observed scan-before-validate order on reopen
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_HEAD_REF: ${{ github.head_ref }}
          REOPENED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            scan_json="$(
              gh run list \
                --workflow scan.yml \
                --branch "$CONTROL_HEAD_REF" \
                --event pull_request \
                --limit 20 \
                --json databaseId,status,conclusion,createdAt |
              jq -c --arg cutoff "$REOPENED_AT" \
                '[.[] | select(.createdAt >= $cutoff)] | sort_by(.databaseId) | last // empty'
            )"
            if [[ -n "$scan_json" ]]; then
              echo "CONTROL_REOPEN_SCAN=$scan_json"
              status="$(jq -r .status <<<"$scan_json")"
              conclusion="$(jq -r .conclusion <<<"$scan_json")"
              if [[ "$status" == completed && "$conclusion" == success ]]; then
                break
              fi
              if [[ "$status" == completed ]]; then
                exit 1
              fi
            fi
            sleep 5
          done
          test "${status:-}" = completed
          test "${conclusion:-}" = success

      - name: Run Anthropic's pinned validation action
        id: validate
        uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@426e469f322952061102b286b378c0c9733a0934
        with:
          marketplace-path: .claude-plugin/marketplace.json
          base-ref: origin/main
          skip-local-folders: "true"
          claude-cli-version: 2.1.215

      - name: Assert the fail-closed validator evaluated the plugin
        env:
          CHANGED_EXTERNAL: ${{ steps.validate.outputs.changed-external }}
          RESULT: ${{ steps.validate.outputs.result }}
        run: |
          set -euo pipefail
          echo "CHANGED_EXTERNAL=$CHANGED_EXTERNAL"
          echo "RESULT=$RESULT"
          jq -e 'length == 1 and .[0].name == "lfs-order-policy-control"' <<<"$CHANGED_EXTERNAL"
          test "$RESULT" = pass
          echo 'CONTROL_VALIDATOR=SUCCESS_WITH_ONE_EVALUATED_TARGET'
