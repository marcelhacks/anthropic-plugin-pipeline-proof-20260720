name: Controlled deployable LFS replay

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Anthropic's pinned bump action for the deployable fixture
        id: bump
        uses: anthropics/claude-plugins-community/.github/actions/bump-plugin-shas@426e469f322952061102b286b378c0c9733a0934
        with:
          marketplace-path: .claude-plugin/marketplace.json
          max-bumps: "1"
          only: lfs-order-policy-control
          pr-mode: batch
          pr-branch: bump/lfs-deployable-3a0fdc2-v2
          claude-cli-version: 2.1.215

      - name: Dispatch policy scan, wait, then dispatch structural validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.bump.outputs.pr-url }}
        run: |
          set -euo pipefail
          test -n "$PR_URL"
          branch=bump/lfs-deployable-3a0fdc2-v2
          echo "CONTROL_PR_URL=$PR_URL"
          echo "CONTROL_BRANCH=$branch"

          gh workflow run scan.yml --ref "$branch"
          for attempt in $(seq 1 24); do
            scan_run="$(gh run list --workflow scan.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            test -n "$scan_run" && break
            sleep 5
          done
          test -n "${scan_run:-}"
          echo "CONTROL_DISPATCH_SCAN_RUN=$scan_run"
          gh run watch "$scan_run" --exit-status

          gh workflow run validate.yml --ref "$branch"
          for attempt in $(seq 1 24); do
            validate_run="$(gh run list --workflow validate.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            test -n "$validate_run" && break
            sleep 5
          done
          test -n "${validate_run:-}"
          echo "CONTROL_DISPATCH_VALIDATE_RUN=$validate_run"
          gh run watch "$validate_run" --exit-status
